<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceClone Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Demo app</p>
          <h1>VoiceClone Lab</h1>
        </div>
        <div class="badge">Browser demo</div>
      </header>

      <main class="layout">
        <section class="panel left-panel">
          <h2>Voice profile</h2>

          <div class="form-row">
            <label for="profileName">Speaker name</label>
            <input id="profileName" type="text" value="My Voice" placeholder="Enter a speaker name" />
          </div>

          <div class="recording-controls">
            <button id="recordButton" class="primary">Record sample</button>
            <button id="stopButton" class="secondary hidden">Stop</button>
          </div>

          <label class="upload-box" for="audioUpload">
            <input id="audioUpload" type="file" accept="audio/*" />
            <span>Upload reference audio</span>
          </label>

          <div class="reference-box">
            <div class="meta-line">
              <span>Reference audio</span>
              <span id="sampleSummary">No sample yet</span>
            </div>
            <audio id="audioPreview" controls class="hidden"></audio>
          </div>

          <div class="profile-card">
            <h3>Style summary</h3>
            <ul id="styleTags" class="tag-list">
              <li>Warm</li>
              <li>Conversational</li>
              <li>Balanced</li>
            </ul>
            <div class="metrics">
              <div>
                <span>Pitch</span>
                <strong id="pitchValue">1.0</strong>
              </div>
              <div>
                <span>Rate</span>
                <strong id="rateValue">1.0</strong>
              </div>
              <div>
                <span>Duration</span>
                <strong id="durationValue">0.0s</strong>
              </div>
            </div>
          </div>

          <button id="saveProfileButton" class="secondary full-width">Save voice profile</button>
        </section>

        <section class="panel right-panel">
          <h2>Text-to-cloned-speech</h2>

          <label for="scriptInput">Script</label>
          <textarea id="scriptInput" rows="8" placeholder="Type the sentence you want the cloned voice to say...">Hi there! This is a demo voice clone created from a saved profile.</textarea>

          <div class="slider-grid">
            <div>
              <label for="pitchSlider">Pitch</label>
              <input id="pitchSlider" type="range" min="0.6" max="1.8" step="0.1" value="1.0" />
            </div>
            <div>
              <label for="rateSlider">Speaking rate</label>
              <input id="rateSlider" type="range" min="0.6" max="1.6" step="0.1" value="1.0" />
            </div>
          </div>

          <div class="action-row">
            <button id="generateButton" class="primary">Generate clone</button>
            <button id="stopSpeechButton" class="secondary">Stop</button>
          </div>

          <div class="status-box">
            <p class="status-label">Status</p>
            <p id="statusText">Ready to create a voice sample.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
